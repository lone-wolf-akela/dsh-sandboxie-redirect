<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sandboxie copy-on-write">
  <rect x="3" y="4" width="58" height="56" rx="12" fill="#0b1418"/>
  <rect x="4.5" y="5.5" width="55" height="53" rx="10.5" fill="none" stroke="#1d3a42" stroke-width="1.5"/>
  <!-- the real disk: the document that must not change -->
  <rect x="13" y="11" width="23" height="29" rx="4" fill="#0f2430" stroke="#2a6f7a" stroke-width="2"/>
  <path d="M19 19h11M19 25h11M19 31h6" stroke="#2a6f7a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the copy: where writes actually land -->
  <rect x="25" y="21" width="27" height="33" rx="5" fill="#0f1722" stroke="#34d399" stroke-width="2.6"/>
  <path d="M31 30h15M31 37h15M31 44h9" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round"/>
  <!-- confinement badge -->
  <circle cx="46" cy="47" r="9.5" fill="#f5b942"/>
  <rect x="41.6" y="45.4" width="8.8" height="6.4" rx="1.6" fill="#0b1418"/>
  <path d="M43.6 45.4v-2.1a2.4 2.4 0 014.8 0v2.1" fill="none" stroke="#0b1418" stroke-width="1.8" stroke-linecap="round"/>
</svg>
